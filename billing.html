<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - 3DForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script> <!-- Razorpay SDK -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-space-blue: #0A1628;
            --electric-cyan: #00D4FF;
            --quantum-purple: #6366F1;
            --metallic-silver: #8B9DC3;
            --neon-green: #10B981;
        }
        /* ... (same CSS as before) ... */
    </style>
</head>
<body>
    <!-- Navigation (same as before) -->
    
    <!-- Main Content -->
    <main class="pt-24 pb-12">
        <div class="max-w-7xl mx-auto px-6">
            <!-- Current Plan -->
            <div class="grid lg:grid-cols-3 gap-8 mb-12">
                <div class="lg:col-span-2">
                    <div class="glass-effect rounded-2xl p-8">
                        <h2 class="text-2xl font-bold text-white mb-6">Current Plan</h2>
                        <!-- Plan details -->
                        <div class="flex flex-col sm:flex-row gap-4">
                            <button id="upgrade-btn" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 text-white py-3 rounded-lg font-semibold">
                                Upgrade Plan
                            </button>
                            <button onclick="window.location.href='dashboard.html'" class="flex-1 border border-cyan-400 text-cyan-400 py-3 rounded-lg font-semibold">
                                Go to Dashboard
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Payment Methods (Simplified for Razorpay) -->
            <div class="glass-effect rounded-2xl p-8 mb-12">
                <h2 class="text-2xl font-bold text-white mb-6">Payment History</h2>
                <div id="payment-history" class="space-y-4">
                    <!-- History will load here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Razorpay Payment Modal (Replaces Stripe) -->
    <div id="razorpay-modal" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="glass-effect rounded-2xl p-8 max-w-md w-full mx-4 text-white">
            <h3 class="text-xl font-bold mb-6">Upgrade Your Plan</h3>
            
            <div class="space-y-4 mb-6">
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="radio" name="plan" value="basic" class="text-cyan-400" checked>
                    <div>
                        <span class="font-semibold">Basic Plan</span>
                        <span class="text-gray-400 block text-sm">15 videos • ₹1,499/month</span>
                    </div>
                </label>
                
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="radio" name="plan" value="pro" class="text-cyan-400">
                    <div>
                        <span class="font-semibold">Pro Plan</span>
                        <span class="text-gray-400 block text-sm">50 videos • ₹3,999/month</span>
                    </div>
                </label>
            </div>

            <div class="flex gap-4">
                <button id="proceed-payment" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 text-white py-3 rounded-lg font-semibold">
                    Pay Now
                </button>
                <button id="close-razorpay-modal" class="flex-1 border border-gray-600 text-gray-300 py-3 rounded-lg font-semibold">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        // Razorpay Billing App
        class BillingApp {
            constructor() {
                this.apiUrl = 'http://localhost:5000/api';
                this.token = localStorage.getItem('token');
                this.user = null;
                this.init();
            }

            async init() {
                if (!this.token) {
                    window.location.href = 'index.html';
                    return;
                }

                await this.fetchUserProfile();
                this.initEventListeners();
                this.loadBillingData();
            }

            async fetchUserProfile() {
                try {
                    const response = await fetch(`${this.apiUrl}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${this.token}` }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.user = data.user;
                        this.updateUI();
                    } else {
                        this.logout();
                    }
                } catch (error) {
                    console.error('Failed to fetch user profile:', error);
                    this.logout();
                }
            }

            initEventListeners() {
                document.getElementById('logout-btn')?.addEventListener('click', () => this.logout());
                document.getElementById('user-menu-btn')?.addEventListener('click', () => {
                    document.getElementById('user-menu').classList.toggle('active');
                });

                document.getElementById('upgrade-btn')?.addEventListener('click', () => this.showRazorpayModal());
                document.getElementById('close-razorpay-modal')?.addEventListener('click', () => this.hideRazorpayModal());
                document.getElementById('proceed-payment')?.addEventListener('click', () => this.initiateRazorpayPayment());
            }

            showRazorpayModal() {
                document.getElementById('razorpay-modal').classList.remove('hidden');
            }

            hideRazorpayModal() {
                document.getElementById('razorpay-modal').classList.add('hidden');
            }

            async initiateRazorpayPayment() {
                const plan = document.querySelector('input[name="plan"]:checked').value;
                
                try {
                    // Create order on backend
                    const response = await fetch(`${this.apiUrl}/payments/create-order`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ plan })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to create order');
                    }

                    const orderData = await response.json();

                    // Razorpay Checkout Options
                    const options = {
                        key: orderData.key,
                        amount: orderData.amount,
                        currency: orderData.currency,
                        name: "3DForge",
                        description: "Premium Video Generation Plan",
                        order_id: orderData.orderId,
                        handler: async (response) => {
                            // Verify payment
                            await this.verifyRazorpayPayment(response);
                        },
                        prefill: {
                            name: this.user.name,
                            email: this.user.email
                        },
                        theme: {
                            color: "#00D4FF"
                        },
                        modal: {
                            ondismiss: () => {
                                this.hideRazorpayModal();
                            }
                        }
                    };

                    // Open Razorpay checkout
                    const razorpay = new Razorpay(options);
                    razorpay.open();

                } catch (error) {
                    console.error('Payment initiation error:', error);
                    this.showNotification('Failed to initiate payment', 'error');
                }
            }

            async verifyRazorpayPayment(razorpayResponse) {
                try {
                    const verifyResponse = await fetch(`${this.apiUrl}/payments/verify-payment`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(razorpayResponse)
                    });

                    const data = await verifyResponse.json();

                    if (data.success) {
                        this.showNotification(`Payment successful! ${data.creditsAdded} credits added.`, 'success');
                        this.hideRazorpayModal();
                        setTimeout(() => window.location.reload(), 2000);
                    } else {
                        this.showNotification('Payment verification failed', 'error');
                    }
                } catch (error) {
                    console.error('Verification error:', error);
                    this.showNotification('Payment verification failed', 'error');
                }
            }

            showNotification(message, type = 'info') {
                // ... (same as before) ...
            }

            logout() {
                localStorage.removeItem('token');
                window.location.href = 'index.html';
            }
        }

        // Initialize billing app
        document.addEventListener('DOMContentLoaded', () => {
            new BillingApp();
        });
    </script>
</body>
</html>
