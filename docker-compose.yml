version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: 3dforge-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: 3dforge
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - 3dforge-network

  # Backend API
  backend:
    build: ./backend
    container_name: 3dforge-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/3dforge?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      STRIPE_SECRET_KEY: sk_live_your_stripe_secret_key
      STRIPE_WEBHOOK_SECRET: whsec_your_webhook_secret
      LUMAAI_API_KEY: your_luma_ai_api_key
      STABILITY_API_KEY: your_stability_ai_api_key
      AWS_ACCESS_KEY_ID: your_aws_access_key
      AWS_SECRET_ACCESS_KEY: your_aws_secret_key
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: 3dforge-videos
      ADMIN_EMAIL: admin@3dforge.com
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - 3dforge-network

  # Frontend Web Server
  frontend:
    build: ./frontend
    container_name: 3dforge-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - 3dforge-network

  # Redis Cache (optional, for session management)
  redis:
    image: redis:7-alpine
    container_name: 3dforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - 3dforge-network

volumes:
  mongodb_data:
  redis_data:

networks:
  3dforge-network:
    driver: bridge